  </defs>
  <rect width="480" height="560" fill="url(#bgp)"/>
  <circle cx="400" cy="90" r="140" fill="#E67E22" opacity="0.35"/>
  <circle cx="60" cy="480" r="110" fill="#F5A76B" opacity="0.25"/>


services:
  app:
    build:
      context: .
      target: runtime
    image: stephane-ouattara-crm:latest
    restart: unless-stopped
    env_file:
      # Optional so a fresh checkout boots with the image defaults; create it
      # from .env.docker.example to set APP_URL and the SMTP credentials.
      - path: .env.docker
        required: false
    ports:
      # Bound to the loopback by default: in production Caddy reaches the app
      # over the compose network, so publishing this publicly would expose a
      # plaintext path around TLS. Keep it for local access and debugging.
      # 8080/8000 are what other local projects grab first, hence 8090.
      # Set APP_BIND=0.0.0.0 to reach it from the LAN.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8090}:80"
    volumes:
      # Every piece of persistent state: SQLite database, app key and uploaded
      # images. One mount, one thing to back up — and it mirrors Railway, which
      # allows a single volume per service.
      - crm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-80}/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Public entry point, started only with `--profile prod`. Terminates TLS and
  # proxies to the app container over the internal network.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    env_file:
      # APP_DOMAIN and ACME_EMAIL are read straight from the file by Caddy.
      # (Compose only interpolates its own ${...} from the shell or ./.env, not
      # from env_file, so passing them through the container is what works.)
      - path: .env.docker
        required: false
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates — persist them or you will hit Let's Encrypt's
      # rate limits after a few redeploys.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  crm-data:
  caddy-data:
  caddy-config:

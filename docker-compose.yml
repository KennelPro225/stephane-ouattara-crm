services:
  app:
    build:
      context: .
      target: runtime
    image: stephane-ouattara-crm:latest
    restart: unless-stopped
    env_file:
      # Optional so a fresh checkout boots with the image defaults; create it
      # from .env.docker.example to set APP_URL and the SMTP credentials.
      - path: .env.docker
        required: false
    ports:
      # Bind a reverse proxy (Caddy, Traefik, nginx…) in front of this for TLS.
      # 8080 and 8000 are the ports other local projects grab first, so the
      # default sits out of their way. Override with APP_PORT when needed.
      - "${APP_PORT:-8090}:80"
    volumes:
      # The SQLite database — the whole CRM lives here, back this up.
      - crm-database:/data
      # Uploaded programme/gallery/site images.
      - crm-uploads:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  crm-database:
  crm-uploads:

; Production PHP settings for the Stéphane Ouattara CRM image.

expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Programme/gallery images are validated at 4 MB, leave room for the envelope.
upload_max_filesize = 8M
post_max_size = 12M

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; The application code never changes inside an immutable image, so opcache
; can skip stat() calls entirely.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

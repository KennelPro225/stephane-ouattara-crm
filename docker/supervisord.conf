[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

; php-fpm serves the application, nginx fronts it, and the queue worker drains
; the booking/contact notifications (they implement ShouldQueue, so without this
; worker no confirmation mail would ever leave the app).

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
priority=5
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --no-interaction
directory=/var/www/html
user=www-data
priority=20
autostart=true
autorestart=true
startretries=3
; Give the worker time to finish the job in flight before it is killed.
stopwaitsecs=70
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
